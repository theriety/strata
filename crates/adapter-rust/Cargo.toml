[package]
name = "strata-adapter-rust"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
publish = false

[lib]
name = "strata_adapter_rust"
path = "src/lib.rs"

[dependencies]
strata-ir = { path = "../ir" }
serde = { workspace = true }
serde_json = { workspace = true }
smol_str = { workspace = true }
rayon = { workspace = true }
syn = { version = "2", features = ["full", "extra-traits", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
ra_ap_ide = "0.0.336"
ra_ap_load-cargo = "0.0.336"
ra_ap_project_model = "0.0.336"
ra_ap_syntax = "0.0.336"
ra_ap_vfs = "0.0.336"

[lints]
workspace = true

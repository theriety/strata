# A standalone fixture workspace analyzed at runtime by the CLI e2e parity test.
# Its repository folder and its `core` crate's directory share one name
# (`dup-pkg-rs/dup-pkg-rs`, the `tokio/tokio` layout), so the crate's package
# key equals the package-group label and must still name a real directory.
#
# This is itself a `[workspace]`, so cargo never treats it as a member of the
# outer unlace workspace.
[workspace]
resolver = "2"
members = ["util", "dup-pkg-rs"]

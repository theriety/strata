[package]
name = "strata-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "strata"
path = "src/main.rs"

[dependencies]
strata-engine = { path = "../engine" }
clap = { version = "4", features = ["derive"] }
serde_json = { workspace = true }
unicode-width = "0.2"

[dev-dependencies]
serde_json = { workspace = true }
strata-engine = { path = "../engine" }
assert_cmd = "2"

[[test]]
name = "parity"
path = "tests/e2e/parity.rs"

[[test]]
name = "cli_acceptance"
path = "tests/e2e/cli_acceptance.rs"

[lints]
workspace = true

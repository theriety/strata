# Constraint target for the `large-app` fixture — see CONTRACT.md for the schema.
#
# Failure mode: scale. 108 files (6 domains x 3 modules x 6 files), dense
# intra-module edges, one cross-module edge per domain, zero cross-domain
# edges. This is the corpus's first three-figure repo: proposal quality must
# hold here, and the run doubles as the QUAL-P3-3 perf measurement point
# (`topological_order` O(V^2) in seed.rs). Emitted by a deterministic
# generator; see the fixture provenance note in fixtures/README.md.

schema = 1
fixture = "large-app"

[meta]
failure_mode = "scale"
language = "typescript"
question = "Does proposal quality hold at three figures of file count?"

[run]
mode = "both"        # greenfield face is asserted below; anchored is timed too
candidates = 3       # engine default k
seed = 42            # engine default seed
config = "defaults"  # pure built-in defaults; no fixture strata.toml

[[precondition]]
kind = "file_count"
min = 108
max = 108
because = "the generator emits exactly 108 files; drift means regeneration broke"

[[assert]]
modes = ["greenfield"]
candidate = 1

[[assert.preserve_dir]]
path = "billing"
because = "each domain is a real, internally dense directory; a three-figure repo that shreds domains is worse than useless"

[[assert.preserve_dir]]
path = "catalog"
because = "symmetric domain-survival floor"

[[assert.preserve_dir]]
path = "identity"
because = "symmetric domain-survival floor"

[[assert.preserve_dir]]
path = "notify"
because = "symmetric domain-survival floor"

[[assert.preserve_dir]]
path = "orders"
because = "symmetric domain-survival floor"

[[assert.preserve_dir]]
path = "search"
because = "symmetric domain-survival floor"

[[assert.size_band]]
scope = "any_container"
max_files = 20
because = "folders above the default folder cap at scale mean the relief machinery failed wholesale"

[[assert.no_synthetic_bucket]]
name = "workspace"
because = "invented buckets hide real structure precisely when there is enough structure to hide"

[[reference.container]]
path = "billing-api"
files = ["src/billing/api/types.ts", "src/billing/api/core.ts", "src/billing/api/helper.ts", "src/billing/api/format.ts", "src/billing/api/guard.ts", "src/billing/api/index.ts"]

[[reference.container]]
path = "billing-ledger"
files = ["src/billing/ledger/types.ts", "src/billing/ledger/core.ts", "src/billing/ledger/helper.ts", "src/billing/ledger/format.ts", "src/billing/ledger/guard.ts", "src/billing/ledger/index.ts"]

[[reference.container]]

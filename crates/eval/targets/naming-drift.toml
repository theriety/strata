# Constraint target for the `naming-drift` fixture — see CONTRACT.md for the schema.
#
# Failure mode: naming-incoherence. `helpers/` is a misleadingly named directory
# holding two genuinely distinct clusters: text/date utilities (no shared edge
# with payments) and a charge/refund payment pair joined by a priced import,
# with checkout touching only charge. A good proposal splits the roof so the
# elected container names align with what actually lives inside.

schema = 1
fixture = "naming-drift"

[meta]
failure_mode = "naming-incoherence"
language = "python"
question = "Does a proposal regroup misnamed containers so names match contents?"

[run]
mode = "both"        # name alignment is mode-independent in a best state
candidates = 3       # engine default k
seed = 42            # engine default seed
config = "defaults"  # pure built-in defaults; no fixture strata.toml

[[precondition]]
kind = "file_count"
min = 5
max = 5
because = "four helpers files plus checkout; any other count means source discovery broke"

# One [[assert]] group (the harness requires exactly one); face-specific pins
# carry their own `mode` override. Regrouping the misnamed roof is greenfield's
# business (see the anchored pins below and D-49): those assertions are pinned
# to the greenfield face, where the split shape is elected.
[[assert]]
modes = ["anchored", "greenfield"]
candidate = 1

[[assert.name_alignment]]
mode = "greenfield"
min_ratio = 0.5
min_members = 2
because = "a container whose name shares tokens with fewer than half its members is the incoherence itself; elected names derive from members, so misses expose fallback or numeric elections and mixed homes"

[[assert.keep_together]]
mode = "greenfield"
paths = ["helpers/charge.py", "helpers/refund.py"]
because = "the payment pair is joined by a priced import; splitting it trades real cohesion for token noise"

[[assert.separate]]
mode = "greenfield"
paths = ["helpers/string_utils.py", "helpers/charge.py"]
because = "shared membership under the misleading helpers roof is the defect; text utilities and card charging must land in different containers"

# Anchored face pinned to MEASURED behavior, never assumed (deviation D-49;
# measured 2026-08-24, seed 42, k=3, built-in defaults): the objective
# honorably elects the weld-plus-absorb — splitting pays an anchoring term of
# .8571 vs the weld's .1429 (6/7 symbols displaced across the priced
# checkout->charge edge), the weld beats the split at every mu incl. 0, and
# only beta=0 AND mu~0 (greenfield's coefficients) flips it, by 0.0107. So
# keeping the misnamed ROOF intact is what anchored actually does; regrouping
# stays greenfield's work above.
[[assert.preserve_dir]]
mode = "anchored"
path = "helpers"
because = "measured behavior (D-49): anchored keeps the misleading helpers ROOF — all five files stay welded under it because anchoring (.8571 vs .1429) dominates any naming gain, so this pin documents the roof surviving while regrouping remains greenfield's business"

[[assert.keep_together]]
mode = "anchored"
paths = ["helpers/charge.py", "helpers/refund.py"]
because = "measured behavior (D-49): the priced-import payment pair stays welded at every mu incl. 0; only beta=0 AND mu~0 flips the weld-vs-split call, and then by just 0.0107, so co-location holds on this face too"

# FIX08 symbol-grain homes: relocation BETWEEN files must not churn homes the
# best state keeps — this fixture's defect is the misleading ROOF, so only the
# container regrouping is the proposal's business.
[[assert.preserve_symbol_home]]
symbol = "pay"
path = "checkout.py"
because = "the checkout entry point is defined and consumed inside checkout.py; hauling it between files churns a home the best state keeps"

[[assert.preserve_symbol_home]]
symbol = "charge_card"
path = "helpers/charge.py"
because = "the charging API belongs beside its private ledger; moving it between files is not what repairs the misnamed roof"

[[assert.preserve_symbol_home]]
symbol = "refund_card"
path = "helpers/refund.py"
because = "the refund flow reads the ledger it was issued against, so its file is already the right home"

[[reference.container]]
path = "utils"
files = ["helpers/string_utils.py", "helpers/date_utils.py"]

[[reference.container]]
path = "payments"
files = ["helpers/charge.py", "helpers/refund.py"]

[[reference.container]]
path = "checkout"
files = ["checkout.py"]

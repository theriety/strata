default_job = "clippy"

[jobs.check]
command = ["cargo", "check", "--workspace", "--all-targets"]
need_stdout = false

[jobs.clippy]
command = [
    "cargo",
    "clippy",
    "--workspace",
    "--all-targets",
    "--all-features",
    "--",
    "-D",
    "warnings",
]
need_stdout = false

[jobs.test]
command = ["cargo", "nextest", "run", "--workspace"]
need_stdout = true

[keybindings]
c = "job:check"
k = "job:clippy"
t = "job:test"
